<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikasa · 聊天</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#e7e9ee;background:#12151b}body{max-width:800px;margin:40px auto;padding:0 20px}h1{font-size:26px}small,#status{color:#aeb8c8}input,textarea,button{font:inherit;border:1px solid #445066;border-radius:8px;padding:10px;background:#202733;color:inherit}input{max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#354a65}button:disabled{opacity:.5;cursor:wait}#connect{display:flex;gap:8px;flex-wrap:wrap}#connect input{flex:1;min-width:180px}#messages{margin:24px 0}article{padding:16px;margin:12px 0;border-radius:10px;background:#202733;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#29394b}textarea{width:100%;box-sizing:border-box;min-height:90px}#composer button{margin-top:10px}#error{color:#ffbdad}label{display:block;margin:12px 0}#resume{width:100%}
</style>
<h1>Mikasa</h1>
<p>输入 /model 查看模型候选，输入 /model 模型ID 或说“切换为 模型ID”切换 GPT、Claude。切换只影响当前会话；/new 开始新聊天，/help 查看命令。</p>
<div id="connect"><input id="token" type="password" placeholder="Mikasa 访问令牌" autocomplete="off" aria-label="Mikasa 访问令牌"><button id="start">新建聊天</button></div>
<label>继续已有会话（可选）<input id="resume" placeholder="聊天 ID" autocomplete="off"><button id="restore">继续聊天</button></label>
<p id="status" role="status">尚未连接。访问令牌仅保存在本页内存，刷新后需重新输入。</p>
<p id="error" role="alert"></p>
<div id="messages" role="log" aria-live="polite"></div>
<form id="composer"><textarea id="message" placeholder="给 Mikasa 发消息…" aria-label="消息" disabled></textarea><button id="send" disabled>发送</button></form>
<script>
'use strict';
const $=id=>document.getElementById(id);
let session=null,busy=false,pending=null;
function lock(value){busy=value;for(const id of ['start','restore','send'])$(id).disabled=value||id==='send'&&!session;$('message').disabled=value||!session;}
async function api(path,body,key){const headers={'Authorization':'Bearer '+$('token').value};if(body!==undefined)headers['Content-Type']='application/json';if(key)headers['Idempotency-Key']=key;const response=await fetch(path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body),redirect:'error',credentials:'omit'});const value=await response.json();if(!response.ok)throw Error(value.error||'请求失败');return value;}
function add(who,text,options=[]){const article=document.createElement('article');article.className=who==='你'?'user':'assistant';article.textContent=who+'\n'+text;for(const model of options){const button=document.createElement('button');button.type='button';button.textContent='切换为 '+model;button.onclick=()=>{if(busy||!session)return;$('message').value='/model '+model;$('composer').requestSubmit();};article.append(document.createElement('br'),button);}$('messages').append(article);article.scrollIntoView({block:'nearest'});}
function state(value){$('status').textContent='会话 '+value.id+' · 请求模型 '+value.model;}
async function connect(resume){if(busy)return;lock(true);$('error').textContent='';try{const id=$('resume').value.trim();const value=resume?await api('/chats/'+encodeURIComponent(id)):await api('/chats',{});session=value;pending=null;$('messages').replaceChildren();for(const t of value.turns){add('你',t.message);add('Mikasa',t.response.reply,t.response.model_options);}$('resume').value=value.id;state(value);}catch(e){$('error').textContent=e.message;}finally{lock(false);}}
$('start').onclick=()=>connect(false);$('restore').onclick=()=>connect(true);
$('composer').onsubmit=async e=>{e.preventDefault();if(busy||!session)return;const message=$('message').value.trim();if(!message)return;if(!pending||pending.message!==message)pending={message,key:crypto.randomUUID()};lock(true);$('error').textContent='';try{const result=await api('/chats/'+session.id+'/messages',{message},pending.key);if(result.chat_id!==session.id){$('messages').replaceChildren();session.id=result.chat_id;$('resume').value=session.id;}add('你',message);add('Mikasa',result.reply,result.model_options);session.model=result.model;state(session);pending=null;$('message').value='';}catch(e){$('error').textContent=e.message+'；可再次发送，重复请求不会再次切换或重复记入聊天。';}finally{lock(false);$('message').focus();}};
</script>
</html>
