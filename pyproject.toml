[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikasa-agent"
version = "0.1.0"
description = "Mikasa engineering coordination and delivery runtime"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mikasa = "mikasa.cli:main"

[tool.setuptools.packages.find]
include = ["mikasa*"]
